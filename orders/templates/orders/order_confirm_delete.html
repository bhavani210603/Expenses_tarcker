{% extends 'orders/base.html' %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-5">
<div class="card p-4 text-center">
    <h5 class="fw-bold text-danger mb-3">Delete Order?</h5>
    <p class="text-muted">Are you sure you want to delete <strong>{{ order.order_id }}</strong> — {{ order.product_name }}?</p>
    <form method="post" class="d-flex gap-2 justify-content-center mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'order_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
</div>
</div>

{% endblock %}
