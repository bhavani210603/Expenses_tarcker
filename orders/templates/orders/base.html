<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar { background: #6b21a8 !important; }
        .navbar-brand, .nav-link { color: white !important; }
        .nav-link:hover { color: #e9d5ff !important; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .badge-pending    { background: #fef3c7; color: #92400e; }
        .badge-shipped    { background: #dbeafe; color: #1e40af; }
        .badge-delivered  { background: #dcfce7; color: #166534; }
        .badge-returned   { background: #fee2e2; color: #991b1b; }
        .badge-cancelled  { background: #f3f4f6; color: #374151; }
        .badge-awaiting   { background: #ffedd5; color: #9a3412; }
        .badge-transferred { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">Meesho Tracker</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'order_list' %}">Orders</a>
            <a class="nav-link" href="{% url 'order_add' %}">+ Add Order</a>
            <a class="nav-link" href="{% url 'import_excel' %}">Import Excel</a>
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
