{% extends 'orders/base.html' %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-8">
<div class="card p-4">
    <h5 class="fw-bold mb-4">{{ title }}</h5>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <div class="form-text text-muted">{{ field.help_text }}</div>
            {% endif %}
            {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
            {% endfor %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn" style="background:#6b21a8;color:white">Save Order</button>
            <a href="{% url 'order_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
</div>
</div>

{% endblock %}
